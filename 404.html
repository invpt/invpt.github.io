<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title></title>Redirecting...</title>
    <script>
      var path = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace("https://miaulia.github.io" + path);
    </script>
  </head>
  <body>
    <p>This page has moved. <a id="link" href="https://miaulia.github.io/">Click here if you are not redirected.</a></p>
    <script>
      document.getElementById("link").href = "https://miaulia.github.io" + path;
    </script>
  </body>
</html>
